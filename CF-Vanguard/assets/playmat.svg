<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Limit Break cardfight playmat</title>
  <desc id="desc">An original two-player playmat layout with Vanguard, rear-guard, guardian, damage, deck, drop, and trigger zones.</desc>
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173a3a"/>
      <stop offset="0.5" stop-color="#102c35"/>
      <stop offset="1" stop-color="#202947"/>
    </linearGradient>
    <linearGradient id="well" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e4c778" stop-opacity=".10"/>
      <stop offset="1" stop-color="#60b6b0" stop-opacity=".035"/>
    </linearGradient>
    <pattern id="grain" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M0 12h48M0 36h48" stroke="#d7e8d6" stroke-opacity=".018"/>
      <circle cx="12" cy="24" r="1" fill="#fff" fill-opacity=".03"/>
      <circle cx="36" cy="4" r="1" fill="#fff" fill-opacity=".025"/>
    </pattern>
    <g id="rg" fill="#d4bd78" fill-opacity=".035" stroke="#bca66b" stroke-opacity=".43" stroke-width="2">
      <circle r="39"/><circle r="31" stroke-opacity=".24" stroke-dasharray="3 5"/>
    </g>
    <g id="vg" fill="#e2c479" fill-opacity=".09" stroke="#e0c478" stroke-opacity=".7" stroke-width="2.5">
      <circle r="46"/><circle r="37" stroke-opacity=".35" stroke-dasharray="4 5"/>
    </g>
    <g id="zone" fill="#0b1b27" fill-opacity=".54" stroke="#8bb8ad" stroke-opacity=".38" stroke-width="1.5">
      <rect width="83" height="116" rx="9"/>
    </g>
  </defs>

  <rect width="1280" height="720" rx="26" fill="url(#felt)"/>
  <rect width="1280" height="720" rx="26" fill="url(#grain)"/>
  <rect x="12" y="12" width="1256" height="696" rx="20" fill="none" stroke="#d5b66f" stroke-opacity=".48" stroke-width="2"/>
  <path d="M28 360h1224" stroke="#e3c87d" stroke-opacity=".22" stroke-width="2"/>
  <path d="M40 354h1200" stroke="#95c5bc" stroke-opacity=".12" stroke-dasharray="4 9"/>

  <!-- CPU formation: three back-row circles, two front-row circles, and Vanguard. -->
  <rect x="274" y="44" width="732" height="291" rx="25" fill="url(#well)" stroke="#b7d0bd" stroke-opacity=".08"/>
  <use href="#rg" x="349" y="96"/><use href="#rg" x="640" y="96"/><use href="#rg" x="931" y="96"/>
  <use href="#rg" x="494" y="236"/><use href="#rg" x="786" y="236"/>
  <use href="#vg" x="640" y="210"/>

  <!-- Guardian area between the two fighters. -->
  <rect x="373" y="337" width="534" height="48" rx="24" fill="#081b24" fill-opacity=".50" stroke="#8fc4ca" stroke-opacity=".26" stroke-width="1.5"/>
  <path d="M405 361h470" stroke="#8fc4ca" stroke-opacity=".11" stroke-dasharray="4 8"/>
  <text x="640" y="366" fill="#9dc2c3" fill-opacity=".52" font-family="sans-serif" font-size="11" letter-spacing="3" text-anchor="middle">GUARDIAN CIRCLE</text>

  <!-- Player formation. -->
  <rect x="274" y="386" width="732" height="291" rx="25" fill="url(#well)" stroke="#b7d0bd" stroke-opacity=".08"/>
  <use href="#vg" x="640" y="447"/>
  <use href="#rg" x="494" y="472"/><use href="#rg" x="786" y="472"/>
  <use href="#rg" x="349" y="612"/><use href="#rg" x="640" y="612"/><use href="#rg" x="931" y="612"/>

  <!-- Auxiliary zones around the central field. -->
  <use href="#zone" x="42" y="94"/><use href="#zone" x="42" y="232"/>
  <text x="83" y="224" fill="#b5cfcb" fill-opacity=".6" font-family="sans-serif" font-size="10" letter-spacing="1.5" text-anchor="middle">DAMAGE</text>
  <text x="83" y="350" fill="#b5cfcb" fill-opacity=".6" font-family="sans-serif" font-size="10" letter-spacing="1.5" text-anchor="middle">DROP</text>
  <use href="#zone" x="1155" y="94"/><use href="#zone" x="1155" y="232"/>
  <text x="1196" y="224" fill="#b5cfcb" fill-opacity=".6" font-family="sans-serif" font-size="10" letter-spacing="1.5" text-anchor="middle">DECK</text>
  <text x="1196" y="350" fill="#b5cfcb" fill-opacity=".6" font-family="sans-serif" font-size="10" letter-spacing="1.5" text-anchor="middle">TRIGGER</text>
  <use href="#zone" x="42" y="393"/><use href="#zone" x="42" y="531"/>
  <text x="83" y="523" fill="#b5cfcb" fill-opacity=".6" font-family="sans-serif" font-size="10" letter-spacing="1.5" text-anchor="middle">DAMAGE</text>
  <text x="83" y="661" fill="#b5cfcb" fill-opacity=".6" font-family="sans-serif" font-size="10" letter-spacing="1.5" text-anchor="middle">DROP</text>
  <use href="#zone" x="1155" y="393"/><use href="#zone" x="1155" y="531"/>
  <text x="1196" y="523" fill="#b5cfcb" fill-opacity=".6" font-family="sans-serif" font-size="10" letter-spacing="1.5" text-anchor="middle">DECK</text>
  <text x="1196" y="661" fill="#b5cfcb" fill-opacity=".6" font-family="sans-serif" font-size="10" letter-spacing="1.5" text-anchor="middle">TRIGGER</text>

</svg>
